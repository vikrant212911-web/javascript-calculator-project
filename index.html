<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator Mini-Project</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --calc-bg: #1e293b;
            --btn-bg: #334155;
            --btn-text: #f8fafc;
            --op-bg: #f97316;
            --clear-bg: #ef4444;
            --display-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--btn-text);
        }

        .calculator {
            background-color: var(--calc-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 360px;
        }

        #display {
            width: 100%;
            height: 70px;
            background-color: var(--display-bg);
            border: none;
            border-radius: 8px;
            color: #22c55e;
            font-size: 2rem;
            text-align: right;
            padding: 0 16px;
            margin-bottom: 20px;
            outline: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 8px;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            font-size: 1.25rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, filter 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        button:hover {
            filter: brightness(1.2);
        }

        button.operator {
            background-color: var(--op-bg);
        }

        button.clear {
            background-color: var(--clear-bg);
        }

        button.zero {
            grid-column: span 2;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" readonly placeholder="0">
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="clear" onclick="deleteLastChar()">⌫</button>
            <button class="operator" onclick="appendOperator('%')">%</button>
            <button class="operator" onclick="appendOperator('/')">÷</button>

            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="appendOperator('*')">×</button>

            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="operator" onclick="appendOperator('-')">-</button>

            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="operator" onclick="appendOperator('+')">+</button>

            <button class="zero" onclick="appendNumber('0')">0</button>
            <button onclick="appendNumber('.')">.</button>
            <button class="operator" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        let expression = '';

        function appendNumber(num) {
            expression += num;
            display.value = expression;
        }

        function appendOperator(op) {
            // Check if string is empty or already ends with an operator character
            if (expression === '' || /[+\-*/%]$/.test(expression)) {
                return;
            }
            expression += op;
            display.value = expression;
        }

        function clearDisplay() {
            expression = '';
            display.value = '';
        }

        function deleteLastChar() {
            expression = expression.toString().slice(0, -1);
            display.value = expression;
        }

        function calculate() {
            if (expression === '') return;
            try {
                // Safeguarded dynamic execution for local evaluation
                let result = Function(`"use strict"; return (${expression})`)();
                display.value = result;
                expression = result.toString();
            } catch (error) {
                display.value = 'Error';
                expression = '';
            }
        }

        // Global Keyboard Support listener
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
            if (e.key === '.') appendNumber(e.key);
            if (['+', '-', '*', '/', '%'].includes(e.key)) appendOperator(e.key);
            if (e.key === 'Enter') { e.preventDefault(); calculate(); }
            if (e.key === 'Backspace') { e.preventDefault(); deleteLastChar(); }
            if (e.key === 'Escape') clearDisplay();
        });
    </script>
</body>
</html>
